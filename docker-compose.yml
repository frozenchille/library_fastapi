version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: library_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://myuser:mypassword@db:5432/library_db
      - SECRET_KEY=your_super_secret_key_here
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./library_front
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  postgres_data: